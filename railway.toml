[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install -r requirements.txt && python -m pip uninstall -y opencv-python && python -m pip install opencv-python-headless"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3